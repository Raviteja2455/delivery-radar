name: Download NSE history (temporary)
on:
  push:
    branches: [probe-live-sources]
    paths: [history.py, .github/workflows/probe.yml]
permissions:
  contents: write
concurrency:
  group: probe
  cancel-in-progress: true
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python history.py 2024-07-05 2020-01-01 hist_old.json || true
      - run: |
          gzip -9 -f hist_old.json || true
          git config user.name "delivery-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hist_old.json.gz hist_old_log.txt
          git commit -m "history output" && git push
