name: Probe live quote sources (temporary)
on:
  push:
    branches: [probe-live-sources]
    paths: [probe.py, .github/workflows/probe.yml]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python probe.py > out.jsonl 2>&1 || true
      - run: |
          git config user.name "delivery-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out.jsonl
          git commit -m "probe output" && git push
