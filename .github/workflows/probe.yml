name: Check the published page (temporary)
on:
  push:
    branches: [probe-live-sources]
    paths: [verify_live.py, .github/workflows/probe.yml]
permissions:
  contents: write
concurrency:
  group: probe
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python verify_live.py > run_out.txt 2>&1 || true
      - run: |
          git config user.name "delivery-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "live check output" && git push
