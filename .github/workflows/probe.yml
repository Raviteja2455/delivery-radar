name: Probe research sources (temporary)
# Runs the nightly script once against the live sources on this branch only, and saves what it
# fetched back to this branch. It never touches main or the published page.
on:
  push:
    branches: [probe-research]
    paths: [probe_trigger.txt, .github/workflows/probe.yml]
permissions:
  contents: write
concurrency:
  group: probe-research
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python radar.py update > run_out.txt 2>&1 || echo "exit $?" >> run_out.txt
      - run: |
          git config user.name "delivery-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "probe output" && git push
